[workspace]
resolver = "2"
members = [
    "crates/nrpc",
    "crates/ncore",
    "crates/nui",
]

[workspace.dependencies]
# Internal crates
nrpc = { path = "crates/nrpc" }
ncore = { path = "crates/ncore" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# RPC (Apache Thrift)
thrift = "0.17"

# Networking
reqwest = { version = "0.12", features = ["stream", "json", "cookies", "blocking"] }

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Encoding
base64 = "0.22"

# String handling
regex = "1"
url = "2"
percent-encoding = "2"

# Clipboard
arboard = "3"

# Crossbeam for concurrent channels
crossbeam = "0.8"
