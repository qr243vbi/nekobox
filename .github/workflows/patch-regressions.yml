name: Patch regression checks
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: provider-manager
          ref: codex/upstream-provider-manager
          suite: core
        - name: tun-dns
          ref: codex/upstream-tun-dns
          suite: core
        - name: xray-bypass
          ref: codex/upstream-xray-bypass
          suite: qt
        - name: routed-xray
          ref: codex/upstream-routed-xray
          suite: routed
        - name: release-core
          ref: main
          suite: core
        - name: release-qt
          ref: main
          suite: qt
    name: ${{ matrix.name }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.ref }}
    - uses: actions/setup-go@v5
      if: matrix.suite == 'core' || matrix.suite == 'routed'
      with:
        go-version: '1.27.3'
        cache-dependency-path: core/server/go.sum
    - name: Test and vet core regression cases
      if: matrix.suite == 'core'
      working-directory: core/server
      shell: pwsh
      run: |
        go test -tags with_clash_api ./internal/boxbox ./internal/process -count=1 -v
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        go vet -tags with_clash_api ./internal/boxbox ./internal/process
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: ilammy/msvc-dev-cmd@v1
      if: matrix.suite == 'qt' || matrix.suite == 'routed'
      with:
        arch: x64
    - uses: qr243vbi/qt6windows7@main
      if: matrix.suite == 'qt' || matrix.suite == 'routed'
      with:
        version: 6.10.0_x86_64
    - name: Test Windows external-core routing helpers
      if: matrix.suite == 'qt'
      shell: pwsh
      run: |
        cmake -S tests/external-core-routing -B routing-build "-DCMAKE_PREFIX_PATH=$env:QT6_DIR"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build routing-build --config Release
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & ./routing-build/Release/external-core-routing-test.exe
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Test routed Xray runtime and flat sing-box rules
      if: matrix.name == 'release-qt' || matrix.suite == 'routed'
      shell: pwsh
      run: |
        cmake -S tests/routed-xray -B routed-xray-build "-DCMAKE_PREFIX_PATH=$env:QT6_DIR"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build routed-xray-build --config Release
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & ./routed-xray-build/Release/routed-xray-profiles.exe
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & ./routed-xray-build/Release/routed-xray-finalize.exe
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Test routed core RPC and compile core
      if: matrix.suite == 'routed'
      working-directory: core/server
      shell: pwsh
      run: |
        go test ./internal/process -count=1 -v
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        go vet ./internal/process
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        go build -tags with_clash_api -o ../../routed-core-compile.exe .
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Test portable packaging
      if: matrix.name == 'release-qt'
      shell: pwsh
      run: |
        python -m unittest discover -s tests -p test_package_portable.py -v
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
